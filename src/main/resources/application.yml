spring:
  application:
    name: Maratona

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USUARIO}
    password: ${DATABASE_SENHA}
    driver-class-name: org.postgresql.Driver

  data:
    mongodb:
      uri: ${MONGO_URI}

    redis:
      url: ${REDIS_URL}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USUARIO}
      password: ${NEO4J_SENHA}

jwt:
  secret: ${JWT_SECRET}
  expiracao-ms: 3600000 # 1 hora

# Origens do front autorizadas a chamar a API pelo navegador. Lista separada por virgula.
# O padrao e o Vite local; em deploy, apontar para o dominio do front.
cors:
  origens: ${CORS_ORIGENS:http://localhost:5173}

# Requisicoes por IP, por janela, nas duas rotas publicas de escrita.
# Contador em memoria: ver a limitacao descrita no RateLimitFilter.
rate-limit:
  login: ${RATE_LIMIT_LOGIN:30}
  cadastro: ${RATE_LIMIT_CADASTRO:10}
  janela-segundos: ${RATE_LIMIT_JANELA:60}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: false