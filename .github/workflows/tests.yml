name: Testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Testes (sem infra externa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Roda com o excludedGroups=integration padrao do pom.xml -- so os testes
      # de controller (@WebMvcTest, servicos mockados) e o JwtServiceTest, sem
      # precisar de Postgres/Mongo/Neo4j/Redis nem JWT_SECRET reais.
      - name: Rodar testes
        run: ./mvnw -B test

  test-integration:
    name: Testes de integracao (Postgres, Mongo, Neo4j, Redis reais)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maratona
          POSTGRES_PASSWORD: maratona
          POSTGRES_DB: maratona
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testesenha123
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testesenha123 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/maratona
      DATABASE_USUARIO: maratona
      DATABASE_SENHA: maratona
      MONGO_URI: mongodb://localhost:27017/maratona
      REDIS_URL: redis://localhost:6379
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USUARIO: neo4j
      NEO4J_SENHA: testesenha123
      # Segredo valido (32 bytes em Base64) apenas para os jobs de CI, nao usado em producao.
      JWT_SECRET: opvn5fqnC4SRMjmwiXrMzXo3Ido96MWmWUqTKQGiPq8=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # -DexcludedGroups= sobrescreve o padrao do pom.xml e inclui o contextLoads
      # (@Tag("integration")), que so sobe com a infra real acima disponivel.
      - name: Rodar suite completa
        run: ./mvnw -B test -DexcludedGroups=
